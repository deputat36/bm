name: Apply operations approval package invariant

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-operations-approval-package-invariant.mjs"
      - ".github/workflows/apply-operations-approval-package-invariant.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/operations-approval-invariants'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/operations-approval-invariants
      - name: Apply package invariant
        run: |
          node --check tools/apply-operations-approval-package-invariant.mjs
          node tools/apply-operations-approval-package-invariant.mjs
          npm run validate:lead-operations-approval
      - name: Commit package change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "No package change."
            exit 0
          fi
          git commit -m "ci: сделать operations approval invariant-based"
          git push origin HEAD:agent/operations-approval-invariants
