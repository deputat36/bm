name: BM contract advertising guard

on:
  push:
    branches: [main]
    paths:
      - "CONTRACT_AD_AUDIT_2026-07-01.md"
      - "data/legal/bm-group-advertising-contract.json"
      - "data/marketing/utm-campaigns.json"
      - "data/marketing/campaign-publications.json"
      - "data/release/manual-gates.json"
      - "catalog/prostornaya-4a/**"
      - "kvartiry-ot-zastroyschika-borisoglebsk/**"
      - "spisok-ozhidaniya/**"
      - "index.html"
      - "catalog/**"
      - "developers/**"
      - "guides/**"
      - "news/**"
      - "contacts/**"
      - "ipoteka/**"
      - "about/**"
      - "sources/**"
      - "legal/**"
      - "privacy/**"
      - "personal-data-consent/**"
      - "advertising/**"
      - "karta-sayta/**"
      - "spasibo/**"
      - "sitemap.xml"
      - "tools/validate-bm-contract-advertising.mjs"
      - "docs/portal/BM_GROUP_ADVERTISING_GUARD.md"
      - ".github/workflows/bm-contract-advertising-guard.yml"
  pull_request:
    paths:
      - "CONTRACT_AD_AUDIT_2026-07-01.md"
      - "data/legal/bm-group-advertising-contract.json"
      - "data/marketing/utm-campaigns.json"
      - "data/marketing/campaign-publications.json"
      - "data/release/manual-gates.json"
      - "catalog/prostornaya-4a/**"
      - "kvartiry-ot-zastroyschika-borisoglebsk/**"
      - "spisok-ozhidaniya/**"
      - "index.html"
      - "catalog/**"
      - "developers/**"
      - "guides/**"
      - "news/**"
      - "contacts/**"
      - "ipoteka/**"
      - "about/**"
      - "sources/**"
      - "legal/**"
      - "privacy/**"
      - "personal-data-consent/**"
      - "advertising/**"
      - "karta-sayta/**"
      - "spasibo/**"
      - "sitemap.xml"
      - "tools/validate-bm-contract-advertising.mjs"
      - "docs/portal/BM_GROUP_ADVERTISING_GUARD.md"
      - ".github/workflows/bm-contract-advertising-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bm-contract-advertising:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check validator
        run: node --check tools/validate-bm-contract-advertising.mjs

      - name: Validate current contract-advertising state
        run: node tools/validate-bm-contract-advertising.mjs

      - name: Accept verified server redirect release without BM ad approval
        run: |
          cp data/legal/bm-group-advertising-contract.json /tmp/bm-contract-baseline.json
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/legal/bm-group-advertising-contract.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const route of data.legacy_transition_routes) {
            route.status = 'server_redirect_released';
            route.server_redirect_status = 'released';
            route.server_redirect.http_status = 308;
            route.server_redirect.preserve_query = true;
            route.server_redirect.hosting_reference = 'issue:7';
            route.server_redirect.evidence = ['issue:7'];
            route.server_redirect.checked_at = '2026-08-25';
            route.server_redirect.reviewer_reference = 'role:release_reviewer';
          }
          data.current_migration_state.server_redirect_release_still_blocked = false;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE
          node tools/validate-bm-contract-advertising.mjs
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/legal/bm-group-advertising-contract.json', 'utf8'));
          if (data.approval.status !== 'requires_external_written_approval') process.exit(1);
          if (data.current_migration_state.server_redirect_release_still_blocked !== false) process.exit(1);
          console.log('Verified redirect fixture accepted without changing BM advertising approval.');
          NODE

      - name: Accept removal of static stubs after verified server redirect
        run: |
          mv kvartiry-ot-zastroyschika-borisoglebsk /tmp/kvartiry-legacy-stub
          mv spisok-ozhidaniya /tmp/spisok-legacy-stub
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/legal/bm-group-advertising-contract.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          data.current_migration_state.legacy_problem_routes_neutralized_as_transition_stubs = false;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE
          node tools/validate-bm-contract-advertising.mjs
          mv /tmp/kvartiry-legacy-stub kvartiry-ot-zastroyschika-borisoglebsk
          mv /tmp/spisok-legacy-stub spisok-ozhidaniya
          cp /tmp/bm-contract-baseline.json data/legal/bm-group-advertising-contract.json
          node tools/validate-bm-contract-advertising.mjs

      - name: Reject released redirect without evidence or query preservation
        run: |
          cp data/legal/bm-group-advertising-contract.json /tmp/bm-contract-baseline.json
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/legal/bm-group-advertising-contract.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const route = data.legacy_transition_routes[0];
          route.status = 'server_redirect_released';
          route.server_redirect_status = 'released';
          route.server_redirect.http_status = 301;
          route.server_redirect.preserve_query = false;
          route.server_redirect.hosting_reference = null;
          route.server_redirect.evidence = [];
          route.server_redirect.checked_at = '2026-08-25';
          route.server_redirect.reviewer_reference = 'role:release_reviewer';
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE
          if node tools/validate-bm-contract-advertising.mjs; then
            echo "Validator incorrectly allowed server redirect release without evidence/query preservation"
            exit 1
          fi
          cp /tmp/bm-contract-baseline.json data/legal/bm-group-advertising-contract.json
          node tools/validate-bm-contract-advertising.mjs

      - name: Reject prohibited public phrase
        run: |
          cp catalog/prostornaya-4a/index.html /tmp/prostornaya-baseline.html
          printf '\n<p>Квартиры от застройщика</p>\n' >> catalog/prostornaya-4a/index.html
          if node tools/validate-bm-contract-advertising.mjs; then
            echo "Validator incorrectly allowed prohibited developer-direct wording"
            exit 1
          fi
          cp /tmp/prostornaya-baseline.html catalog/prostornaya-4a/index.html

      - name: Reject old single-project domain
        run: |
          cp index.html /tmp/home-baseline.html
          printf '\n<a href="https://tellermanovsad.ru/">old</a>\n' >> index.html
          if node tools/validate-bm-contract-advertising.mjs; then
            echo "Validator incorrectly allowed old single-project domain"
            exit 1
          fi
          cp /tmp/home-baseline.html index.html

      - name: Reject regression in legacy transition stub
        run: |
          cp spisok-ozhidaniya/index.html /tmp/waitlist-baseline.html
          printf '\n<form><input name="phone"><button>Отправить</button></form>\n' >> spisok-ozhidaniya/index.html
          if node tools/validate-bm-contract-advertising.mjs; then
            echo "Validator incorrectly allowed lead form on BM legacy transition stub"
            exit 1
          fi
          cp /tmp/waitlist-baseline.html spisok-ozhidaniya/index.html

      - name: Reject covered-object publication without written approval
        run: |
          cp data/marketing/campaign-publications.json /tmp/publications-baseline.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/marketing/campaign-publications.json', 'utf8'));
          data.publications.push({
            publication_id: 'test_bm_publication',
            campaign_id: 'prostornaya_4a_vk_launch',
            status: 'published',
            channel: 'vk',
            external_url: 'https://example.com/test-publication',
            published_at: '2026-08-09T18:00:00+03:00',
            evidence: 'issue:7',
            owner: 'role:campaign_owner'
          });
          fs.writeFileSync('data/marketing/campaign-publications.json', JSON.stringify(data, null, 2) + '\n');
          NODE
          if node tools/validate-bm-contract-advertising.mjs; then
            echo "Validator incorrectly allowed covered-object publication without written approval"
            exit 1
          fi
          cp /tmp/publications-baseline.json data/marketing/campaign-publications.json
          node tools/validate-bm-contract-advertising.mjs
