name: Catalog rule quiz guard

on:
  pull_request:
    paths:
      - "index.html"
      - "catalog/index.html"
      - "assets/js/catalog-rule-quiz.js"
      - "assets/js/main.js"
      - "data/qa/catalog-rule-quiz.json"
      - "data/qa/form-scenarios.json"
      - "tools/validate-catalog-rule-quiz.mjs"
      - "tools/validate-homepage-conversion-routes.mjs"
      - "tools/run-catalog-quiz-keyboard-qa.mjs"
      - "docs/portal/CATALOG_RULE_QUIZ.md"
      - "docs/portal/HOMEPAGE_CONVERSION_ROUTES.md"
      - ".github/workflows/catalog-rule-quiz.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "catalog/index.html"
      - "assets/js/catalog-rule-quiz.js"
      - "assets/js/main.js"
      - "data/qa/catalog-rule-quiz.json"
      - "data/qa/form-scenarios.json"
      - "tools/validate-catalog-rule-quiz.mjs"
      - "tools/validate-homepage-conversion-routes.mjs"
      - "tools/run-catalog-quiz-keyboard-qa.mjs"
      - "docs/portal/CATALOG_RULE_QUIZ.md"
      - "docs/portal/HOMEPAGE_CONVERSION_ROUTES.md"
      - ".github/workflows/catalog-rule-quiz.yml"

permissions:
  contents: read

concurrency:
  group: catalog-rule-quiz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-catalog-rule-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Chromium
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/catalog-rule-quiz.js
          node --check tools/validate-catalog-rule-quiz.mjs
          node --check tools/validate-homepage-conversion-routes.mjs
          node --check tools/run-catalog-quiz-keyboard-qa.mjs

      - name: Validate catalog rule quiz
        run: node tools/validate-catalog-rule-quiz.mjs

      - name: Validate homepage selection route
        run: node tools/validate-homepage-conversion-routes.mjs

      - name: Audit catalog quiz keyboard handoffs
        env:
          CATALOG_QUIZ_KEYBOARD_QA_OUTPUT_DIR: artifacts/catalog-quiz-keyboard-qa
        run: node tools/run-catalog-quiz-keyboard-qa.mjs

      - name: Validate failed-run evidence contract
        run: |
          rm -rf artifacts/catalog-quiz-keyboard-qa-failure-contract
          set +e
          CATALOG_QUIZ_KEYBOARD_QA_OUTPUT_DIR=artifacts/catalog-quiz-keyboard-qa-failure-contract \
          CATALOG_QUIZ_KEYBOARD_QA_BASE_URL=http://127.0.0.1:0 \
          node tools/run-catalog-quiz-keyboard-qa.mjs
          runner_exit=$?
          set -e
          if [[ "$runner_exit" -eq 0 ]]; then
            echo "Failure-contract self-test unexpectedly passed."
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const summaryPath = 'artifacts/catalog-quiz-keyboard-qa-failure-contract/summary.json';
          if (!fs.existsSync(summaryPath)) throw new Error('Failure summary.json was not created');
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          if (summary.status !== 'failed') throw new Error(`Expected failed status, got ${summary.status}`);
          if (summary.all_keyboard_handoffs_passed !== false) throw new Error('Failed run cannot report keyboard handoffs passed');
          if (!summary.failure?.message) throw new Error('Failed run must persist failure.message');
          if (!Number.isInteger(summary.audit_count) || summary.audit_count < 0) throw new Error('Failed run must persist audit_count');
          console.log(`Failure evidence contract passed with runner exit ${process.env.RUNNER_EXIT || 'nonzero'}: ${summary.failure.message}`);
          NODE

      - name: Publish keyboard summary
        if: always()
        run: |
          if [[ ! -f artifacts/catalog-quiz-keyboard-qa/summary.json ]]; then
            echo '### Catalog quiz keyboard QA' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo 'Summary was not created; inspect the runner/bootstrap failure.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('artifacts/catalog-quiz-keyboard-qa/summary.json', 'utf8'));
          console.log('### Catalog quiz keyboard QA');
          console.log('');
          console.log(`- Status: ${summary.status || 'unknown'}`);
          console.log(`- Audits: ${summary.audit_count}/${summary.expected_audit_count}`);
          console.log(`- Keyboard handoffs passed: ${summary.all_keyboard_handoffs_passed}`);
          console.log(`- Live lead requests: ${summary.live_lead_requests}`);
          if (summary.failure?.message) console.log(`- Failure: ${summary.failure.message}`);
          console.log('- Flow: start → 5 steps → back/forward → result → existing quick form.');
          console.log('- Browser emulation only; this does not replace manual keyboard or screen-reader QA.');
          NODE

      - name: Upload keyboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-quiz-keyboard-qa-${{ github.run_id }}
          path: |
            artifacts/catalog-quiz-keyboard-qa/
            artifacts/catalog-quiz-keyboard-qa-failure-contract/
          retention-days: 14
          if-no-files-found: warn
