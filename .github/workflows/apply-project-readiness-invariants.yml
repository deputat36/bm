name: Apply project readiness invariants

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-project-readiness-invariants.mjs"
      - ".github/workflows/apply-project-readiness-invariants.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/project-readiness-invariants'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-readiness-invariants
      - name: Apply exact readiness patch
        run: |
          node --check tools/apply-project-readiness-invariants.mjs
          node tools/apply-project-readiness-invariants.mjs
          npm run validate:project-readiness
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portal/PROJECT_VERIFICATION_READINESS.md package.json
          if git diff --cached --quiet; then
            echo "No readiness changes to commit."
            exit 0
          fi
          git commit -m "ci: сделать project readiness invariant-based"
          git push origin HEAD:agent/project-readiness-invariants
