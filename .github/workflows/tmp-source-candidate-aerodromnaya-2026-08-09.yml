name: Temporary source candidate patch

on:
  push:
    branches:
      - agent/source-research-aerodromnaya-sennaya-2026-08-09

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed source candidate patch
        run: node tools/patch-source-candidate-aerodromnaya-2026-08-09.mjs

      - name: Validate source collection
        run: npm run validate:source-collection

      - name: Remove one-time patch files
        run: |
          rm tools/patch-source-candidate-aerodromnaya-2026-08-09.mjs
          rm .github/workflows/tmp-source-candidate-aerodromnaya-2026-08-09.yml

      - name: Commit permanent result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/source-collection.json tools/patch-source-candidate-aerodromnaya-2026-08-09.mjs .github/workflows/tmp-source-candidate-aerodromnaya-2026-08-09.yml
          git diff --cached --quiet && exit 0
          git commit -m "research: зафиксировать кандидата ПСК для Аэродромной 18Г"
          git push
