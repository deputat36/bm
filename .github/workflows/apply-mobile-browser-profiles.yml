name: Apply mobile browser profiles

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-mobile-browser-profiles.mjs"
      - ".github/workflows/apply-mobile-browser-profiles.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p0-mobile-browser-emulation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-mobile-browser-emulation

      - name: Install pinned Playwright package
        run: npm install --no-save playwright@1.62.0

      - name: Apply exact runner and validator patch
        run: |
          node --check tools/apply-mobile-browser-profiles.mjs
          node tools/apply-mobile-browser-profiles.mjs
          node --check tools/run-form-browser-qa.mjs
          node --check tools/validate-form-browser-qa-artifact.mjs

      - name: Commit permanent mobile profile support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run-form-browser-qa.mjs tools/validate-form-browser-qa-artifact.mjs
          git commit -m "qa: добавить Android и iPhone browser-профили"
          git push origin HEAD:agent/p0-mobile-browser-emulation
