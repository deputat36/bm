name: Form browser QA

on:
  pull_request:
    paths:
      - "index.html"
      - "catalog/**"
      - "contacts/**"
      - "ipoteka/**"
      - "spasibo/**"
      - "assets/js/main.js"
      - "assets/js/schema.js"
      - "assets/js/analytics-debug.js"
      - "assets/js/conversion-tracking.js"
      - "assets/js/mobile-lead-bar.js"
      - "assets/js/form-accessibility.js"
      - "data/qa/form-scenarios.json"
      - "tools/run-form-browser-qa.mjs"
      - "tools/validate-form-browser-qa-artifact.mjs"
      - "tools/browser-profile-preload.mjs"
      - "tools/run-profiled-form-browser-qa.mjs"
      - "tools/validate-profiled-form-browser-qa-artifact.mjs"
      - ".github/workflows/form-browser-qa.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "catalog/**"
      - "contacts/**"
      - "ipoteka/**"
      - "spasibo/**"
      - "assets/js/main.js"
      - "assets/js/schema.js"
      - "assets/js/analytics-debug.js"
      - "assets/js/conversion-tracking.js"
      - "assets/js/mobile-lead-bar.js"
      - "assets/js/form-accessibility.js"
      - "data/qa/form-scenarios.json"
      - "tools/run-form-browser-qa.mjs"
      - "tools/validate-form-browser-qa-artifact.mjs"
      - "tools/browser-profile-preload.mjs"
      - "tools/run-profiled-form-browser-qa.mjs"
      - "tools/validate-profiled-form-browser-qa-artifact.mjs"
      - ".github/workflows/form-browser-qa.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Пусто — локальная версия checkout; production — только https://novostroyki-borisoglebsk.ru"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: form-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-profile:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: desktop
            label: Desktop Chromium emulation
            profile: desktop_chromium_emulation
            engine: chromium
            emulated_device: desktop-custom
            install_engine: chromium
            output_dir: artifacts/form-browser-qa-desktop
          - slug: android
            label: Android Chromium emulation
            profile: android_chromium_emulation
            engine: chromium
            emulated_device: Pixel 7
            install_engine: chromium
            output_dir: artifacts/form-browser-qa-android
          - slug: iphone
            label: iPhone WebKit emulation
            profile: iphone_webkit_emulation
            engine: webkit
            emulated_device: iPhone 13
            install_engine: webkit
            output_dir: artifacts/form-browser-qa-iphone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright engine
        env:
          PLAYWRIGHT_ENGINE: ${{ matrix.install_engine }}
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps "$PLAYWRIGHT_ENGINE"

      - name: Check QA tool syntax
        run: |
          node --check tools/run-form-browser-qa.mjs
          node --check tools/validate-form-browser-qa-artifact.mjs
          node --check tools/browser-profile-preload.mjs
          node --check tools/run-profiled-form-browser-qa.mjs
          node --check tools/validate-profiled-form-browser-qa-artifact.mjs

      - name: Resolve QA target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_BASE_URL: ${{ inputs.base_url }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_BASE_URL" ]]; then
            NORMALIZED_ORIGIN="$(node -e 'process.stdout.write(new URL(process.argv[1]).origin)' "$REQUESTED_BASE_URL")"
            printf 'QA_BASE_URL=%s\n' "$NORMALIZED_ORIGIN" >> "$GITHUB_ENV"
            echo 'QA_START_SERVER=0' >> "$GITHUB_ENV"
            echo 'QA_EXPECTED_MODE=allowlisted_remote' >> "$GITHUB_ENV"
            printf 'QA_EXPECTED_ORIGIN=%s\n' "$NORMALIZED_ORIGIN" >> "$GITHUB_ENV"
          else
            echo 'QA_BASE_URL=http://127.0.0.1:4173' >> "$GITHUB_ENV"
            echo 'QA_START_SERVER=1' >> "$GITHUB_ENV"
            echo 'QA_EXPECTED_MODE=local_static' >> "$GITHUB_ENV"
            echo 'QA_EXPECTED_ORIGIN=http://127.0.0.1:4173' >> "$GITHUB_ENV"
          fi

      - name: Run 14 unique scenarios and storage checks
        env:
          QA_DEVICE_PROFILE: ${{ matrix.profile }}
          QA_OUTPUT_DIR: ${{ matrix.output_dir }}
          QA_RUN_STORAGE: "1"
          QA_HEADLESS: "1"
        run: node tools/run-profiled-form-browser-qa.mjs

      - name: Validate privacy-safe QA artifact
        if: always()
        env:
          QA_EXPECTED_DEVICE_PROFILE: ${{ matrix.profile }}
          QA_EXPECTED_BROWSER_ENGINE: ${{ matrix.engine }}
          QA_EXPECTED_EMULATED_DEVICE: ${{ matrix.emulated_device }}
          QA_OUTPUT_DIR: ${{ matrix.output_dir }}
        run: node tools/validate-profiled-form-browser-qa-artifact.mjs "$QA_OUTPUT_DIR"

      - name: Publish concise job summary
        if: always()
        env:
          QA_OUTPUT_DIR: ${{ matrix.output_dir }}
          QA_PROFILE_LABEL: ${{ matrix.label }}
        run: |
          if [[ ! -f "$QA_OUTPUT_DIR/summary.json" ]]; then
            printf '### %s\n\nSummary artifact was not created.\n' "$QA_PROFILE_LABEL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync(`${process.env.QA_OUTPUT_DIR}/summary.json`, "utf8"));
          const s = data.summary || {};
          console.log(`### ${process.env.QA_PROFILE_LABEL}`);
          console.log("");
          console.log(`- Target: ${data.target?.mode || "unknown"}`);
          console.log(`- Origin: ${data.target?.origin || "unknown"}`);
          console.log(`- Profile: ${data.target?.device_profile || "unknown"}`);
          console.log(`- Engine: ${data.target?.browser_engine || "unknown"}`);
          console.log(`- Emulated device: ${data.target?.emulated_device || "unknown"}`);
          console.log(`- Unique scenarios: ${s.unique_scenarios || 0}`);
          console.log(`- Scenario runs: ${s.scenario_passed || 0} passed / ${s.scenario_failed || 0} failed`);
          console.log(`- Aerodromnaya detailed runs: ${s.aerodromnaya_detailed_runs || 0}`);
          console.log(`- Storage: ${s.storage_passed || 0} passed / ${s.storage_failed || 0} failed`);
          console.log("");
          console.log("This is browser/device emulation, not a physical device. It does not update form-results.json or manual gates automatically.");
          NODE

      - name: Upload privacy-safe QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-browser-qa-${{ matrix.slug }}-${{ github.run_id }}
          path: ${{ matrix.output_dir }}
          if-no-files-found: warn
          retention-days: 14
