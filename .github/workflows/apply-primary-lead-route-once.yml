name: Apply primary lead route once

on:
  push:
    branches: ["agent/primary-lead-endpoint"]
    paths:
      - "tools/apply-primary-lead-route.mjs"
      - ".github/workflows/apply-primary-lead-route-once.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/apply-primary-lead-route.mjs"
      - ".github/workflows/apply-primary-lead-route-once.yml"
      - "tools/validate-primary-lead-route.mjs"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply primary lead route
        run: node tools/apply-primary-lead-route.mjs
      - name: Check transformed scripts
        run: |
          node --check assets/js/main.js
          node --check assets/js/schema.js
          node tools/validate-primary-lead-route.mjs
          node tools/validate-lead-submit-integrity.mjs
          node tools/validate-offline-draft-privacy.mjs
      - name: Validate static site
        run: node tools/validate-static-site.mjs
      - name: Validate thank-you context
        run: node tools/validate-thankyou-context.mjs
      - name: Validate catalog conversion
        run: node tools/validate-catalog-conversion.mjs
      - name: Validate catalog rule quiz
        run: node tools/validate-catalog-rule-quiz.mjs
      - name: Validate operations approval
        run: node tools/validate-lead-operations-approval.mjs
      - name: Validate operations runtime
        run: node tools/validate-lead-operations-runtime.mjs
      - name: Validate operations launch gate
        run: node tools/validate-launch-operations-gate.mjs
      - name: Validate form QA execution pack
        run: node tools/validate-form-qa-execution-pack.mjs
      - name: Validate guides and conversion routes
        run: |
          node tools/validate-guide-permit-commissioning.mjs
          node tools/validate-guide-uncommissioned-section.mjs
          node tools/validate-guide-content-registry.mjs
          node tools/validate-guide-launch-gate.mjs
          node tools/validate-guide-review-pack.mjs
          node tools/validate-homepage-object-cta.mjs
          node tools/validate-contacts-conversion.mjs
          node tools/validate-mortgage-conversion.mjs
          node tools/validate-contextual-conversion.mjs
          node tools/validate-lead-source-output.mjs
          node tools/validate-form-role-analytics.mjs
      - name: Validate analytics and campaign flows
        run: |
          node tools/validate-analytics-events.mjs
          node tools/validate-analytics-funnel-report.mjs
          node tools/validate-analytics-debug-mode.mjs
          node tools/validate-conversion-runtime.mjs
          node tools/validate-form-qa-scenarios.mjs
          node tools/validate-form-qa-results.mjs
          node tools/validate-campaign-release.mjs
          node tools/validate-campaign-publications.mjs
      - name: Validate verification and safety gates
        run: |
          node tools/validate-object-verification-profiles.mjs
          node tools/validate-prostornaya-page-verification-safety.mjs
          node tools/validate-project-verification-summary.mjs
          node tools/validate-project-readiness-report.mjs
          node tools/validate-source-collection.mjs
          node tools/validate-launch-gates.mjs
          node tools/validate-form-fail-closed.mjs
          node tools/validate-primary-lead-route.mjs
      - name: Remove one-time tooling
        run: rm tools/apply-primary-lead-route.mjs .github/workflows/apply-primary-lead-route-once.yml
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Подключить формы к основному серверному реестру"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
