name: Apply primary lead route once

on:
  push:
    branches: ["agent/primary-lead-endpoint"]
    paths:
      - "tools/apply-primary-lead-route.mjs"
      - ".github/workflows/apply-primary-lead-route-once.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/apply-primary-lead-route.mjs"
      - ".github/workflows/apply-primary-lead-route-once.yml"
      - "tools/validate-primary-lead-route.mjs"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply primary lead route
        run: node tools/apply-primary-lead-route.mjs
      - name: Check transformed JavaScript
        run: |
          node --check assets/js/main.js
          node --check assets/js/schema.js
      - name: Validate primary route
        run: node tools/validate-primary-lead-route.mjs
      - name: Validate submit integrity
        run: node tools/validate-lead-submit-integrity.mjs
      - name: Validate offline privacy
        run: node tools/validate-offline-draft-privacy.mjs
      - name: Validate complete project
        run: npm run validate
      - name: Remove one-time tooling
        run: rm tools/apply-primary-lead-route.mjs .github/workflows/apply-primary-lead-route-once.yml
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Подключить формы к основному серверному реестру"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
