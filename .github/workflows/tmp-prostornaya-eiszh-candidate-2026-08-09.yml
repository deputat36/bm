name: Temporary Prostornaya EISZH candidate patch

on:
  push:
    branches:
      - agent/prostornaya-eiszh-candidate-2026-08-09

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed EISZH candidate patch
        run: node tools/patch-prostornaya-eiszh-candidate-2026-08-09.mjs

      - name: Validate source contracts
        run: |
          npm run validate:source-collection
          node tools/validate-object-source-discovery.mjs

      - name: Remove one-time patch files
        run: |
          rm tools/patch-prostornaya-eiszh-candidate-2026-08-09.mjs
          rm .github/workflows/tmp-prostornaya-eiszh-candidate-2026-08-09.yml

      - name: Commit permanent result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/source-collection.json tools/patch-prostornaya-eiszh-candidate-2026-08-09.mjs .github/workflows/tmp-prostornaya-eiszh-candidate-2026-08-09.yml
          git diff --cached --quiet && exit 0
          git commit -m "research: зафиксировать EISZH candidate Просторной 4А"
          git push
