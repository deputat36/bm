name: Build browser QA evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/build-browser-qa-evidence.mjs"
      - ".github/workflows/build-browser-qa-evidence.yml"

permissions:
  contents: write
  actions: read

jobs:
  build-evidence:
    if: github.head_ref == 'agent/p0-browser-qa-evidence-2026-08-06'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-browser-qa-evidence-2026-08-06

      - name: Download verified browser artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-form-browser-qa-31085851541
          path: /tmp/browser-qa
          github-token: ${{ github.token }}
          repository: deputat36/bm
          run-id: 31085851541

      - name: Generate durable evidence
        run: |
          node --check tools/build-browser-qa-evidence.mjs
          node tools/build-browser-qa-evidence.mjs /tmp/browser-qa evidence/qa/2026-08-06-browser
          node -e 'const fs=require("fs"); for (const file of ["summary.json","event-contexts.json","manifest.json"]) JSON.parse(fs.readFileSync(`evidence/qa/2026-08-06-browser/${file}`,"utf8")); console.log("Generated evidence JSON is valid.");'

      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/qa/2026-08-06-browser
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "qa: сохранить evidence browser-приёмки 2026-08-06"
          git push origin HEAD:agent/p0-browser-qa-evidence-2026-08-06
