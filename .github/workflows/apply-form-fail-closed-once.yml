name: Apply form fail-closed once

on:
  push:
    branches: ["agent/fail-closed-lead-forms"]
    paths:
      - "tools/apply-form-fail-closed.mjs"
      - ".github/workflows/apply-form-fail-closed-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply fail-closed transformation
        run: node tools/apply-form-fail-closed.mjs
      - name: Validate transformed forms
        run: node tools/validate-form-fail-closed.mjs
      - name: Remove one-time tooling
        run: rm tools/apply-form-fail-closed.mjs .github/workflows/apply-form-fail-closed-once.yml
      - name: Commit transformed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Защитить формы при отказе JavaScript"
          git push origin "HEAD:${GITHUB_REF_NAME}"
