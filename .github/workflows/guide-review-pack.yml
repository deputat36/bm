name: Guide review pack

on:
  push:
    branches: [main]
    paths:
      - "data/content/guide-review-contract.json"
      - "data/content/guide-review-results.json"
      - "data/content/guides.json"
      - "tools/build-guide-review-pack.mjs"
      - "tools/validate-guide-review-pack.mjs"
      - "docs/portal/GUIDE_REVIEW_PACK.md"
      - "package.json"
      - ".github/workflows/guide-review-pack.yml"
  pull_request:
    paths:
      - "data/content/guide-review-contract.json"
      - "data/content/guide-review-results.json"
      - "data/content/guides.json"
      - "tools/build-guide-review-pack.mjs"
      - "tools/validate-guide-review-pack.mjs"
      - "docs/portal/GUIDE_REVIEW_PACK.md"
      - "package.json"
      - ".github/workflows/guide-review-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-guide-review-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check scripts
        run: |
          node --check tools/build-guide-review-pack.mjs
          node --check tools/validate-guide-review-pack.mjs

      - name: Validate review contract and results
        run: node tools/validate-guide-review-pack.mjs

      - name: Generate review execution pack
        run: |
          node tools/build-guide-review-pack.mjs --format=json > /tmp/guide-review-pack.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/guide-review-pack.json","utf8")); const s=data.summary||{}; if(data.status!=="review_pack_only_no_implied_approval"||s.total_guides!==8||s.editorial_tasks!==8||s.legal_tasks!==7||s.total_tasks!==15) process.exit(1); const recorded=Number(s.recorded_results||0); const passed=Number(s.passed||0); const failed=Number(s.failed||0); const blocked=Number(s.blocked||0); const notRun=Number(s.not_run||0); if(recorded!==passed+failed+blocked||passed+failed+blocked+notRun!==15||recorded<0||recorded>15) process.exit(1); console.log(`Guide review tasks: ${s.total_tasks}; recorded: ${recorded}; passed: ${passed}; failed: ${failed}; blocked: ${blocked}; not run: ${notRun}`);'
