name: Lead operations approval guard

on:
  push:
    branches: [main]
    paths:
      - "data/operations/lead-operations-approval.json"
      - "data/operations/lead-handling.json"
      - "data/operations/lead-lifecycle.json"
      - "data/operations/lead-handoff.json"
      - "data/operations/lead-event-log.json"
      - "data/qa/form-scenarios.json"
      - "docs/portal/LEAD_OPERATIONS_APPROVAL.md"
      - "docs/portal/LEAD_OPERATIONS_RUNBOOK.md"
      - "supabase/functions/newbuild-lead/index.ts"
      - "supabase/migrations/*newbuild_lead_operations*.sql"
      - "tools/validate-lead-operations-approval.mjs"
      - "tools/validate-lead-operations-runtime.mjs"
      - "tools/build-lead-operations-approval-report.mjs"
      - ".github/workflows/lead-operations-approval-guard.yml"
      - "package.json"
  pull_request:
    paths:
      - "data/operations/lead-operations-approval.json"
      - "data/operations/lead-handling.json"
      - "data/operations/lead-lifecycle.json"
      - "data/operations/lead-handoff.json"
      - "data/operations/lead-event-log.json"
      - "data/qa/form-scenarios.json"
      - "docs/portal/LEAD_OPERATIONS_APPROVAL.md"
      - "docs/portal/LEAD_OPERATIONS_RUNBOOK.md"
      - "supabase/functions/newbuild-lead/index.ts"
      - "supabase/migrations/*newbuild_lead_operations*.sql"
      - "tools/validate-lead-operations-approval.mjs"
      - "tools/validate-lead-operations-runtime.mjs"
      - "tools/build-lead-operations-approval-report.mjs"
      - ".github/workflows/lead-operations-approval-guard.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-lead-operations-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check scripts
        run: |
          node --check tools/validate-lead-operations-approval.mjs
          node --check tools/validate-lead-operations-runtime.mjs
          node --check tools/build-lead-operations-approval-report.mjs

      - name: Validate owner decisions and operational flags
        run: |
          node tools/validate-lead-operations-approval.mjs
          node tools/validate-lead-operations-runtime.mjs

      - name: Generate approval readiness report
        run: |
          node tools/build-lead-operations-approval-report.mjs --format=json > /tmp/lead-operations-approval.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/lead-operations-approval.json","utf8")); const s=data.summary||{}; if(s.total_decisions!==8||s.required_operational_fields!==13||s.activation_gates!==7) process.exit(1); const total=Number(s.approved_decisions||0)+Number(s.pending_decisions||0)+Number(s.rejected_decisions||0)+Number(s.superseded_decisions||0); if(total!==8) process.exit(1); const ready=s.activation_enabled===true&&s.all_decisions_approved===true&&s.approved_decisions===8&&s.pending_decisions===0&&s.rejected_decisions===0&&s.superseded_decisions===0; const expected=ready?"operational_activation_ready_for_controlled_test":"owner_decisions_required_not_operational"; if(data.status!==expected) process.exit(1); console.log(`Owner decisions: ${s.approved_decisions}/${s.total_decisions}; pending=${s.pending_decisions}; rejected=${s.rejected_decisions}; superseded=${s.superseded_decisions}; activation=${s.activation_enabled}; status=${data.status}`);'
