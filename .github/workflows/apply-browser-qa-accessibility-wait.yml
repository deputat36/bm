name: Apply browser QA accessibility wait

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-browser-qa-accessibility-wait.mjs"
      - ".github/workflows/apply-browser-qa-accessibility-wait.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p0-production-browser-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-production-browser-qa

      - name: Apply exact runner patch
        run: |
          node --check tools/apply-browser-qa-accessibility-wait.mjs
          node tools/apply-browser-qa-accessibility-wait.mjs
          node --check tools/run-form-browser-qa.mjs

      - name: Commit runner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/run-form-browser-qa.mjs
          git commit -m "qa: ждать готовности accessibility-слоя"
          git push origin HEAD:agent/p0-production-browser-qa
