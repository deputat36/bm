name: Apply remove legacy email remnants once

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply-remove-legacy-email-remnants.mjs"
      - "tools/validate-no-legacy-email-remnants.mjs"
      - ".github/workflows/apply-remove-legacy-email-remnants-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Remove legacy browser email remnants
        run: node tools/apply-remove-legacy-email-remnants.mjs
      - name: Check cleanup contracts
        run: |
          node --check assets/js/main.js
          node tools/validate-no-legacy-email-remnants.mjs
          node tools/validate-primary-lead-route.mjs
          node tools/validate-lead-submit-integrity.mjs
          node tools/validate-offline-draft-privacy.mjs
      - name: Validate core forms and operations
        run: |
          node tools/validate-static-site.mjs
          node tools/validate-thankyou-context.mjs
          node tools/validate-catalog-conversion.mjs
          node tools/validate-catalog-rule-quiz.mjs
          node tools/validate-lead-operations-approval.mjs
          node tools/validate-lead-operations-runtime.mjs
          node tools/validate-launch-operations-gate.mjs
          node tools/validate-form-qa-execution-pack.mjs
          node tools/validate-guide-permit-commissioning.mjs
      - name: Validate guide uncommissioned section
        run: node tools/validate-guide-uncommissioned-section.mjs
      - name: Validate guide content registry
        run: node tools/validate-guide-content-registry.mjs
      - name: Validate guide launch gate
        run: node tools/validate-guide-launch-gate.mjs
      - name: Validate guide review pack
        run: node tools/validate-guide-review-pack.mjs
      - name: Validate homepage object CTA
        run: node tools/validate-homepage-object-cta.mjs
      - name: Validate contacts conversion
        run: node tools/validate-contacts-conversion.mjs
      - name: Validate mortgage conversion
        run: node tools/validate-mortgage-conversion.mjs
      - name: Validate contextual conversion
        run: node tools/validate-contextual-conversion.mjs
      - name: Validate lead source output
        run: node tools/validate-lead-source-output.mjs
      - name: Validate analytics and campaigns
        run: |
          node tools/validate-form-role-analytics.mjs
          node tools/validate-analytics-events.mjs
          node tools/validate-analytics-funnel-report.mjs
          node tools/validate-analytics-debug-mode.mjs
          node tools/validate-conversion-runtime.mjs
          node tools/validate-form-qa-scenarios.mjs
          node tools/validate-form-qa-results.mjs
          node tools/validate-campaign-release.mjs
          node tools/validate-campaign-publications.mjs
      - name: Validate verification and safety gates
        run: |
          node tools/validate-object-verification-profiles.mjs
          node tools/validate-prostornaya-page-verification-safety.mjs
          node tools/validate-project-verification-summary.mjs
          node tools/validate-project-readiness-report.mjs
          node tools/validate-source-collection.mjs
          node tools/validate-launch-gates.mjs
          node tools/validate-form-fail-closed.mjs
          node tools/validate-primary-lead-route.mjs
      - name: Remove one-time tooling
        run: rm tools/apply-remove-legacy-email-remnants.mjs .github/workflows/apply-remove-legacy-email-remnants-once.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Удалить остатки старого почтового транспорта"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
