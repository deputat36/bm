name: Apply Prostornaya source reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-prostornaya-source-reconciliation.mjs"
      - ".github/workflows/apply-prostornaya-source-reconciliation.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/source-reconcile-prostornaya-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/source-reconcile-prostornaya-2026-08-09

      - name: Apply exact reconciliation
        run: |
          node --check tools/apply-prostornaya-source-reconciliation.mjs
          node tools/apply-prostornaya-source-reconciliation.mjs
          node tools/validate-source-collection.mjs
          npm run validate:source-collection

      - name: Commit source registry changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/source-collection.json package.json
          if git diff --cached --quiet; then
            echo "No source reconciliation changes to commit."
            exit 0
          fi
          git commit -m "data: принять документы Просторной 4А"
          git push origin HEAD:agent/source-reconcile-prostornaya-2026-08-09
