name: Apply guide layout content-ready

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-guide-layout-ready.mjs"
      - ".github/workflows/apply-guide-layout-ready.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/guide-layout-content-ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/guide-layout-content-ready
      - name: Apply exact content-ready patch
        run: |
          node --check tools/apply-guide-layout-ready.mjs
          node tools/apply-guide-layout-ready.mjs
          node --check tools/validate-guide-review-pack.mjs
          node --check tools/validate-guide-launch-gate.mjs
          node tools/validate-guide-review-pack.mjs
          npm run validate:guide-content
          npm run validate:guide-launch-readiness
      - name: Commit permanent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content/guides.json package.json tools/validate-guide-review-pack.mjs
          if git diff --cached --quiet; then
            echo "No content-ready changes to commit."
            exit 0
          fi
          git commit -m "content: отметить гайд по планировке content-ready"
          git push origin HEAD:agent/guide-layout-content-ready
