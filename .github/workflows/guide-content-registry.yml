name: Guide content registry

on:
  push:
    branches: [main]
    paths:
      - "data/content/guides.json"
      - "guides/**"
      - "sitemap.xml"
      - "tools/validate-guide-content-registry.mjs"
      - "tools/build-guide-content-report.mjs"
      - "docs/portal/GUIDE_CONTENT_REGISTRY.md"
      - ".github/workflows/guide-content-registry.yml"
  pull_request:
    paths:
      - "data/content/guides.json"
      - "guides/**"
      - "sitemap.xml"
      - "tools/validate-guide-content-registry.mjs"
      - "tools/build-guide-content-report.mjs"
      - "docs/portal/GUIDE_CONTENT_REGISTRY.md"
      - ".github/workflows/guide-content-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-guide-content-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check scripts
        run: |
          node --check tools/validate-guide-content-registry.mjs
          node --check tools/build-guide-content-report.mjs

      - name: Validate guide registry
        run: node tools/validate-guide-content-registry.mjs

      - name: Generate guide readiness report
        run: |
          node tools/build-guide-content-report.mjs --format=json > /tmp/guide-content-report.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/guide-content-report.json","utf8")); const s=data.summary||{}; if(data.status!=="editorial_registry_not_publication_approval"||s.total_guides!==8) process.exit(1); const ready=Number(s.index_ready||0), blocked=Number(s.index_blocked||0), verified=Number(s.source_verified||0), sourcePending=Number(s.source_review_required||0), sourceNA=Number(s.source_not_applicable||0), editorial=Number(s.editorial_passed||0), legal=Number(s.legal_passed||0); if(ready+blocked!==8||verified+sourcePending+sourceNA!==8||editorial<ready||legal<0||legal>8) process.exit(1); console.log(`Guide registry: ${s.total_guides}; ready: ${ready}; blocked: ${blocked}; editorial passed: ${editorial}; legal passed: ${legal}`);'
