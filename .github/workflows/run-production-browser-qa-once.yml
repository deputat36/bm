name: Production form browser QA once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/run-production-browser-qa-once.yml"
      - ".github/workflows/form-browser-qa.yml"
      - "tools/run-form-browser-qa.mjs"
      - "tools/validate-form-browser-qa-artifact.mjs"

permissions:
  contents: read

concurrency:
  group: production-form-browser-qa-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-production:
    if: github.head_ref == 'agent/p0-production-browser-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium

      - name: Check QA tool syntax
        run: |
          node --check tools/run-form-browser-qa.mjs
          node --check tools/validate-form-browser-qa-artifact.mjs

      - name: Run production-domain dry-run
        env:
          QA_BASE_URL: https://novostroyki-borisoglebsk.ru
          QA_START_SERVER: "0"
          QA_EXPECTED_MODE: allowlisted_remote
          QA_EXPECTED_ORIGIN: https://novostroyki-borisoglebsk.ru
          QA_OUTPUT_DIR: artifacts/production-form-browser-qa
          QA_RUN_STORAGE: "1"
          QA_HEADLESS: "1"
        run: node tools/run-form-browser-qa.mjs

      - name: Validate privacy-safe production artifact
        if: always()
        env:
          QA_EXPECTED_MODE: allowlisted_remote
          QA_EXPECTED_ORIGIN: https://novostroyki-borisoglebsk.ru
        run: node tools/validate-form-browser-qa-artifact.mjs artifacts/production-form-browser-qa

      - name: Upload production QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-form-browser-qa-${{ github.run_id }}
          path: artifacts/production-form-browser-qa
          if-no-files-found: warn
          retention-days: 14
