name: Apply guide review pack invariants

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-guide-review-pack-invariants.mjs"
      - ".github/workflows/apply-guide-review-pack-invariants.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/guide-layout-editorial-review-2026-08-09'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/guide-layout-editorial-review-2026-08-09
      - name: Apply structural package check
        run: |
          node --check tools/apply-guide-review-pack-invariants.mjs
          node tools/apply-guide-review-pack-invariants.mjs
          node tools/validate-guide-review-pack.mjs
          npm run validate:guide-review-pack
      - name: Commit package invariant
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "No package change."
            exit 0
          fi
          git commit -m "ci: сделать guide review pack invariant-based"
          git push origin HEAD:agent/guide-layout-editorial-review-2026-08-09
