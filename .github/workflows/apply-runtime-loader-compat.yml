name: Apply runtime loader compatibility

on:
  push:
    branches:
      - agent/issue-151-form-analytics-storage-readiness
    paths:
      - "tools/apply-runtime-loader-compat.mjs"
      - ".github/workflows/apply-runtime-loader-compat.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/issue-151-form-analytics-storage-readiness
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply compatibility patch
        run: node tools/apply-runtime-loader-compat.mjs

      - name: Validate patch
        run: |
          node --check assets/js/schema.js
          node --check tools/validate-conversion-runtime.mjs
          node --check tools/validate-page-accessibility.mjs
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/schema.js tools/validate-conversion-runtime.mjs tools/validate-page-accessibility.mjs
          if git diff --cached --quiet; then
            echo "No compatibility changes"
          else
            git commit -m "Согласовать runtime loader с validators"
            git push origin HEAD:agent/issue-151-form-analytics-storage-readiness
          fi
