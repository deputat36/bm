name: Apply phone pattern runtime fix

on:
  pull_request:
    branches:
      - main
    paths:
      - "tools/apply-phone-pattern-runtime-fix.mjs"
      - ".github/workflows/apply-phone-pattern-runtime-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/p0-desktop-browser-qa'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/p0-desktop-browser-qa

      - name: Apply exact runtime patch
        run: |
          node --check tools/apply-phone-pattern-runtime-fix.mjs
          node tools/apply-phone-pattern-runtime-fix.mjs
          node --check assets/js/form-accessibility.js

      - name: Commit confirmed runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/form-accessibility.js
          git commit -m "fix: исправить phone pattern для Chromium 151"
          git push origin HEAD:agent/p0-desktop-browser-qa
